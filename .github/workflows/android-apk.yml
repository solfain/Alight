name: Build Android APK

on:
  push:
    branches:
      - 'arena/00659f22-alight'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK was not found at $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-motion-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="open-motion-apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Open Motion Android APK (build $GITHUB_RUN_NUMBER)" \
            --notes "Unofficial sideloadable WebView build of the MIT-licensed Open Motion editor. This is not the official Alight Motion or CapCut app. Install the APK only if you trust this source." \
            --prerelease
